# Keep local API private by default; Docker supplies 0.0.0.0 for the internal network.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8080

# Set these in the terminal that starts Spring; do not commit real passwords.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns schema creation; Hibernate only checks that mappings match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# These settings make the local session usable over HTTP without exposing it to scripts.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
